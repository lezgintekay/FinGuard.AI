<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>FinGuard AI - Pro Dashboard</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

    <style>
        :root {
            --bg-dark: #0a0a0b;
            --sidebar-bg: #111114;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-primary: #6366f1; /* Indigo */
            --accent-success: #10b981; /* Emerald */
            --accent-error: #ef4444;   /* Rose */
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
        }

        body {
            margin: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .dashboard-wrapper {
            display: flex;
            padding: 24px;
            gap: 24px;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Modern Sidebar */
        .sidebar {
            width: 280px;
            background-color: var(--sidebar-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 32px 20px;
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 24px;
            height: calc(100vh - 48px);
        }

        .logo-area {
            padding: 0 12px 40px;
        }

        .logo-title {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(to right, #fff, #a1a1aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            border-radius: 14px;
            color: var(--text-muted);
            text-decoration: none;
            transition: all 0.3s ease;
            margin-bottom: 4px;
        }

        .nav-item.active {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--card-border);
        }

        /* Main Content area */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
        }

        .page-title { font-size: 14px; color: var(--text-muted); font-weight: 500; }
        .ai-status { 
            display: flex; align-items: center; gap: 8px; font-size: 13px; 
            background: rgba(16, 185, 129, 0.1); padding: 6px 14px; border-radius: 20px;
            color: var(--accent-success); border: 1px solid rgba(16, 185, 129, 0.2);
        }

        /* Bento Grid Layout */
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 24px;
        }

        .glass-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 28px;
            backdrop-filter: blur(10px);
        }

        .card-label { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); font-weight: 700; margin-bottom: 12px; display: block; }
        .card-value { font-size: 42px; font-weight: 800; margin: 0; }

        /* AI Alert Styles */
        .ai-report-card {
            grid-column: span 5;
            position: relative;
            overflow: hidden;
            border-width: 2px;
        }

        .ai-report-card.critical { border-color: rgba(239, 68, 68, 0.3); background: linear-gradient(145deg, rgba(74, 18, 22, 0.4), rgba(20, 20, 20, 0.4)); }
        .ai-report-card.success { border-color: rgba(16, 185, 129, 0.3); background: linear-gradient(145deg, rgba(17, 52, 40, 0.4), rgba(20, 20, 20, 0.4)); }

        .ai-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 800;
            margin-bottom: 16px;
            background: rgba(255, 255, 255, 0.05);
        }

        .action-plan {
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid var(--card-border);
        }

        /* Modern Table */
        .table-container {
            grid-column: span 12;
            padding: 0;
            overflow: hidden;
        }

        .table-header { padding: 24px 28px; border-bottom: 1px solid var(--card-border); display: flex; align-items: center; gap: 12px; }
        .table-header h3 { margin: 0; font-size: 18px; }

        .custom-table { width: 100%; border-collapse: collapse; }
        .custom-table th { text-align: left; padding: 20px 28px; font-size: 11px; color: var(--text-muted); text-transform: uppercase; border-bottom: 1px solid var(--card-border); }
        .custom-table td { padding: 20px 28px; border-bottom: 1px solid var(--card-border); font-size: 14px; transition: background 0.3s; }
        .custom-table tr:hover td { background: rgba(255, 255, 255, 0.02); }

        .badge {
            padding: 5px 12px; border-radius: 10px; font-size: 11px; font-weight: 700;
            background: rgba(234, 179, 8, 0.1); color: #eab308; border: 1px solid rgba(234, 179, 8, 0.2);
        }

        @media (max-width: 1200px) {
            .ai-report-card { grid-column: span 12; }
            .balance-card { grid-column: span 12; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [riskData, setRiskData] = React.useState(null);
            const [invoices, setInvoices] = React.useState([]);
            const [loading, setLoading] = React.useState(true);

            React.useEffect(() => {
                const fetchData = async () => {
                    try {
                        const riskRes = await fetch('http://localhost:5155/api/Analysis/risk');
                        if (riskRes.ok) {
                            const riskJson = await riskRes.json();
                            setRiskData(riskJson);
                        }
                        const invRes = await fetch('http://localhost:5155/api/Fatura');
                        if (invRes.ok) {
                            const invJson = await invRes.json();
                            setInvoices(invJson);
                        }
                    } catch (error) {
                        console.error("Fetch hatası:", error);
                    } finally {
                        setLoading(false);
                    }
                };
                fetchData();
            }, []);

            return (
                <div className="dashboard-wrapper">
                    {/* Sidebar */}
                    <nav className="sidebar">
                        <div className="logo-area">
                            <div className="logo-title">FIN GUARD AI</div>
                            <div style={{fontSize: '10px', color: 'var(--text-muted)', marginTop: '4px'}}>Institutional Grade CFO-Bot</div>
                        </div>
                        
                        <div style={{flex: 1}}>
                            <a href="#" className="nav-item active">
                                <span className="material-symbols-outlined">grid_view</span>
                                <span>Genel Bakış</span>
                            </a>
                            <a href="#" className="nav-item">
                                <span className="material-symbols-outlined">receipt_long</span>
                                <span>Faturalar</span>
                            </a>
                            <a href="#" className="nav-item">
                                <span className="material-symbols-outlined">payments</span>
                                <span>Nakit Akışı</span>
                            </a>
                            <a href="#" className="nav-item">
                                <span className="material-symbols-outlined">smart_toy</span>
                                <span>Bot Ayarları</span>
                            </a>
                        </div>

                        <div style={{paddingTop: '20px', borderTop: '1px solid var(--card-border)'}}>
                            <div style={{display: 'flex', alignItems: 'center', gap: '12px'}}>
                                <div style={{width: '36px', height: '36px', borderRadius: '10px', background: 'var(--accent-primary)', display: 'grid', placeItems: 'center'}}>
                                    <span className="material-symbols-outlined" style={{fontSize: '20px'}}>person</span>
                                </div>
                                <div>
                                    <div style={{fontSize: '13px', fontWeight: 'bold'}}>Admin Panel</div>
                                    <div style={{fontSize: '11px', color: 'var(--text-muted)'}}>Premium Plan</div>
                                </div>
                            </div>
                        </div>
                    </nav>

                    {/* Main Content */}
                    <div className="main-content">
                        <header className="top-header">
                            <div className="page-title">Yönetim Paneli / Analiz</div>
                            <div className="ai-status">
                                <span className="material-symbols-outlined" style={{fontSize: '18px'}}>bolt</span>
                                <span>Gemini 1.5 Flash Aktif</span>
                            </div>
                        </header>

                        <div className="bento-grid">
                            {/* Kasa Özeti */}
                            <div className="glass-card balance-card" style={{gridColumn: 'span 7', position: 'relative'}}>
                                <div style={{position: 'absolute', top: '28px', right: '28px'}}>
                                    <span className="material-symbols-outlined" style={{color: 'var(--accent-primary)', fontSize: '32px'}}>account_balance_wallet</span>
                                </div>
                                <span className="card-label">Kasa Nakit Mevcudu</span>
                                <h2 className="card-value">₺50.000,00</h2>
                                
                                <div style={{marginTop: '40px', display: 'flex', gap: '48px'}}>
                                    <div>
                                        <div style={{fontSize: '11px', color: 'var(--text-muted)', fontWeight: 700}}>Gelecek Ödemeler</div>
                                        <div style={{fontSize: '18px', fontWeight: 800, color: '#e5e2e1', marginTop: '4px'}}>₺445.000,00</div>
                                    </div>
                                    <div>
                                        <div style={{fontSize: '11px', color: 'var(--text-muted)', fontWeight: 700}}>Risk Altındaki Tutar</div>
                                        <div style={{fontSize: '18px', fontWeight: 800, color: 'var(--accent-error)', marginTop: '4px'}}>₺395.000,00</div>
                                    </div>
                                </div>
                            </div>

                            {/* AI Raporu */}
                            <div className={`glass-card ai-report-card ${riskData?.RiskDurumu === 'Kritik' ? 'critical' : 'success'}`}>
                                {loading ? (
                                    <div style={{textAlign: 'center', padding: '40px', color: 'var(--text-muted)'}}>
                                        <div className="material-symbols-outlined animate-spin" style={{fontSize: '40px', marginBottom: '16px'}}>refresh</div>
                                        <div>AI Analiz Ediyor...</div>
                                    </div>
                                ) : (
                                    <React.Fragment>
                                        <div className="ai-badge">
                                            <span className="material-symbols-outlined" style={{fontSize: '14px'}}>auto_awesome</span>
                                            CFO-BOT ANALİZİ
                                        </div>
                                        <h3 style={{margin: '0 0 12px 0', fontSize: '24px', fontWeight: 800}}>
                                            Durum: <span style={{color: riskData?.RiskDurumu === 'Kritik' ? 'var(--accent-error)' : 'var(--accent-success)'}}>{riskData?.RiskDurumu}</span>
                                        </h3>
                                        <p style={{fontSize: '13px', lineHeight: '1.6', color: '#d1d1d6', margin: 0}}>{riskData?.Mesaj}</p>
                                        
                                        {riskData?.AcikTutar > 0 && (
                                            <div className="action-plan">
                                                <div style={{fontSize: '11px', fontWeight: 800, color: 'var(--accent-error)', marginBottom: '6px'}}>KRİTİK EYLEM PLANI</div>
                                                <div style={{fontSize: '12px', color: '#fff', lineHeight: '1.5'}}>{riskData.OnerilenAksiyon}</div>
                                            </div>
                                        )}
                                    </React.Fragment>
                                )}
                            </div>

                            {/* Tablo Alanı */}
                            <div className="glass-card table-container">
                                <div className="table-header">
                                    <span className="material-symbols-outlined" style={{color: 'var(--text-muted)'}}>list_alt</span>
                                    <h3 style={{fontWeight: 800}}>Fatura Kayıtları</h3>
                                    <div style={{marginLeft: 'auto', display: 'flex', gap: '8px'}}>
                                        <div style={{background: 'var(--card-bg)', border: '1px solid var(--card-border)', borderRadius: '10px', padding: '6px 12px', fontSize: '12px', cursor: 'pointer'}}>Filtrele</div>
                                        <div style={{background: 'var(--card-bg)', border: '1px solid var(--card-border)', borderRadius: '10px', padding: '6px 12px', fontSize: '12px', cursor: 'pointer'}}>Dışa Aktar</div>
                                    </div>
                                </div>
                                <table className="custom-table">
                                    <thead>
                                        <tr>
                                            <th>ID</th>
                                            <th>Müşteri / Cari</th>
                                            <th>Vade Tarihi</th>
                                            <th>Tutar</th>
                                            <th>Statü</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {Array.isArray(invoices) && invoices.length > 0 ? (
                                            invoices.map((inv) => (
                                                <tr key={inv.id || inv.faturaNo}>
                                                    <td style={{fontFamily: 'monospace', color: 'var(--accent-primary)', fontWeight: 'bold'}}>{inv.faturaNo}</td>
                                                    <td style={{fontWeight: '700'}}>{inv.cariAd}</td>
                                                    <td style={{color: 'var(--text-muted)'}}>{inv.vadeTarihi ? new Date(inv.vadeTarihi).toLocaleDateString('tr-TR') : '-'}</td>
                                                    <td style={{fontWeight: '900'}}>₺{inv.tutar?.toLocaleString('tr-TR')}</td>
                                                    <td>
                                                        <span className="badge">{inv.durum || 'Bekliyor'}</span>
                                                    </td>
                                                </tr>
                                            ))
                                        ) : (
                                            <tr>
                                                <td colSpan="5" style={{textAlign: 'center', padding: '40px', color: 'var(--text-muted)'}}>Veri bekleniyor...</td>
                                            </tr>
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
